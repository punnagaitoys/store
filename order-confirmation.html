<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Order Confirmed — Thank you for your purchase at Punnagai Toy Store, Mylapore, Chennai"
    />
    <meta name="robots" content="noindex, nofollow" />
    <title>Order Confirmed | Punnagai Toy Store</title>
    <link rel="icon" href="logo.png" type="image/png" />
    <link rel="apple-touch-icon" href="logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
    <style>
      .confirmation-wrapper {
        min-height: 70vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 60px 0;
      }

      .confirmation-card {
        background: var(--surface);
        border-radius: var(--radius-lg, 16px);
        border: 1px solid var(--border);
        padding: 48px;
        max-width: 640px;
        width: 100%;
        margin: 0 auto;
        text-align: center;
        box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
        animation: fadeSlideUp 0.4s ease;
      }

      @keyframes fadeSlideUp {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .confirmation-icon {
        width: 80px;
        height: 80px;
        background: linear-gradient(135deg, #22c55e, #16a34a);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 24px;
        box-shadow: 0 4px 20px rgba(34, 197, 94, 0.35);
      }

      .confirmation-icon svg {
        color: white;
      }

      .confirmation-title {
        font-family: 'Fredoka', sans-serif;
        font-size: 2rem;
        font-weight: 600;
        color: var(--text-primary);
        margin-bottom: 8px;
      }

      .confirmation-subtitle {
        color: var(--text-secondary);
        font-size: 1rem;
        margin-bottom: 32px;
        line-height: 1.6;
      }

      .order-id-badge {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        background: var(--bg-alt, #f3f4f6);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 10px 20px;
        font-family: 'Courier New', monospace;
        font-size: 0.95rem;
        font-weight: 700;
        color: var(--text-primary);
        margin-bottom: 32px;
        letter-spacing: 0.5px;
      }

      .confirmation-details {
        background: var(--bg-alt, #f9fafb);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 24px;
        text-align: left;
        margin-bottom: 32px;
      }

      .confirmation-details-title {
        font-weight: 700;
        font-size: 0.9rem;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        color: var(--text-secondary);
        margin-bottom: 16px;
      }

      .detail-row {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        padding: 8px 0;
        border-bottom: 1px solid var(--border);
        font-size: 14px;
        gap: 16px;
      }

      .detail-row:last-child {
        border-bottom: none;
      }

      .detail-row .label {
        color: var(--text-secondary);
        flex-shrink: 0;
      }
      .detail-row .value {
        font-weight: 600;
        text-align: right;
        color: var(--text-primary);
      }

      .order-items-list {
        background: var(--bg-alt, #f9fafb);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 24px;
        text-align: left;
        margin-bottom: 32px;
      }

      .order-item-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 8px 0;
        border-bottom: 1px solid var(--border);
        font-size: 14px;
        gap: 12px;
      }

      .order-item-row:last-child {
        border-bottom: none;
      }

      .order-item-name {
        flex: 1;
        color: var(--text-primary);
        font-weight: 500;
      }
      .order-item-qty {
        color: var(--text-secondary);
        font-size: 13px;
        white-space: nowrap;
      }
      .order-item-price {
        font-weight: 700;
        color: var(--primary);
        white-space: nowrap;
      }

      .confirmation-actions {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .whatsapp-track-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        background: #25d366;
        color: white;
        font-weight: 700;
        font-size: 1rem;
        padding: 14px 28px;
        border-radius: var(--radius, 10px);
        border: none;
        cursor: pointer;
        text-decoration: none;
        transition:
          background 0.2s,
          transform 0.1s;
      }

      .whatsapp-track-btn:hover {
        background: #1ebe5a;
        transform: translateY(-1px);
      }

      .loading-state {
        padding: 40px 0;
        color: var(--text-secondary);
      }

      @media (max-width: 600px) {
        .confirmation-card {
          padding: 28px 20px;
        }
        .confirmation-title {
          font-size: 1.5rem;
        }
      }
    </style>
  </head>
  <body>
    <div id="navbar"></div>
    <div id="toast-container" class="toast-container"></div>

    <main class="page-wrapper confirmation-wrapper">
      <div class="container">
        <div id="confirmation-content" class="confirmation-card">
          <div class="loading-state">
            <div class="loading-spinner" style="margin: 0 auto 16px"></div>
            <p>Loading your order details...</p>
          </div>
        </div>
      </div>
    </main>

    <div id="footer"></div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
    <!-- App Scripts -->
    <script src="js/env-config.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/data.js"></script>
    <script src="js/lib/cart-storage.js"></script>
    <script src="js/lib/cart-logic.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/app.js"></script>

    <script>
      'use strict';

      const TRACKING_WHATSAPP_NUMBER = '917550132101';

      function escHtml(str) {
        return String(str == null ? '' : str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function fmt(n) {
        return '₹' + (Number(n) || 0).toLocaleString('en-IN');
      }

      function buildTrackWhatsAppUrl(orderId) {
        const settings = window.PunnagaiSettings ? window.PunnagaiSettings.get() : null;
        const phone = ((settings && settings.whatsappNumber) || TRACKING_WHATSAPP_NUMBER).replace(
          /\D/g,
          ''
        );
        const msg = encodeURIComponent(
          `Hello! 👋 I'd like to track my order from Punnagai Toy Store.\n\n*Order ID:* ${orderId}\n\nCould you please share the current status? Thank you! 🙏`
        );
        return `https://wa.me/${phone}?text=${msg}`;
      }

      function statusBadgeInfo(status) {
        const map = {
          pending_verification: {
            label: 'Payment Under Verification',
            color: '#d97706',
            bg: '#fef3c7'
          },
          pending: { label: 'Payment Under Verification', color: '#d97706', bg: '#fef3c7' },
          confirmed: { label: 'Payment Verified & Confirmed', color: '#2563eb', bg: '#dbeafe' },
          ready_for_pickup: { label: 'Ready for Store Pickup', color: '#16a34a', bg: '#dcfce7' },
          completed: { label: 'Order Picked Up / Completed', color: '#059669', bg: '#d1fae5' },
          cancelled: { label: 'Order Cancelled', color: '#dc2626', bg: '#fee2e2' },
          refunded: { label: 'Refunded', color: '#7c3aed', bg: '#ede9fe' }
        };
        return map[status] || { label: status, color: '#4b5563', bg: '#f3f4f6' };
      }

      function renderConfirmation(order) {
        const card = document.getElementById('confirmation-content');
        if (!card) return;

        const orderId = order.id || order.orderId || 'N/A';
        const items = Array.isArray(order.items) ? order.items : [];
        const customer = order.customer || order.shippingAddress || {};
        const status = order.orderStatus || 'pending_verification';
        const badge = statusBadgeInfo(status);

        const itemsHtml = items
          .map(
            (it) => `
      <div class="order-item-row" style="display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid var(--border); font-size:14px;">
        <div style="flex:1; padding-right:12px;">
          <span class="order-item-name" style="font-weight:600; color:var(--text-primary);">${escHtml(it.name || it.productId || 'Toy')}</span>
          <div style="font-size:12px; color:var(--text-muted);">Qty: ${Number(it.quantity) || 1}</div>
        </div>
        <span class="order-item-price" style="font-weight:700; color:var(--text-primary);">${fmt((Number(it.price) || 0) * (Number(it.quantity) || 1))}</span>
      </div>
    `
          )
          .join('');

        const discountRow =
          order.discount && Number(order.discount) > 0
            ? `<div class="detail-row"><span class="label">Discount</span><span class="value" style="color:var(--success, #16a34a)">−${fmt(order.discount)}</span></div>`
            : '';

        const proofSection = order.paymentProofUrl
          ? `
          <div style="margin-top:20px; padding:16px; background:#ffffff; border:1px solid var(--border); border-radius:12px;">
            <div style="font-weight:700; font-size:0.88rem; margin-bottom:8px; display:flex; align-items:center; gap:6px; color:var(--text-primary);">
              <span>📸</span> Uploaded Payment Proof:
            </div>
            <div style="display:flex; align-items:center; gap:14px; flex-wrap:wrap;">
              <a href="${escHtml(order.paymentProofUrl)}" target="_blank" rel="noopener">
                <img src="${escHtml(order.paymentProofUrl)}" alt="Payment Proof" style="width:70px; height:70px; object-fit:cover; border-radius:8px; border:1px solid var(--border); box-shadow:0 2px 6px rgba(0,0,0,0.08);" />
              </a>
              <div>
                <a href="${escHtml(order.paymentProofUrl)}" target="_blank" rel="noopener" class="btn btn-sm btn-outline" style="font-size:0.8rem; padding:4px 12px;">
                  🔍 View Full Screenshot
                </a>
                ${order.transactionRef ? `<div style="font-size:12px; color:var(--text-muted); margin-top:4px;">UTR: <strong>${escHtml(order.transactionRef)}</strong></div>` : ''}
              </div>
            </div>
          </div>
        `
          : '';

        // Dynamic title and message depending on state
        let title = 'Order Submitted for Verification! 🎉';
        let subtitle =
          'We have received your payment screenshot! Our store manager is verifying your receipt with our merchant account and preparing your toys for pickup.';

        if (status === 'confirmed' || status === 'ready_for_pickup') {
          title = 'Order Ready for In-Store Pickup! 🛍️';
          subtitle =
            'Your payment has been verified! Your order is packed and ready for collection at our Mylapore shop.';
        } else if (status === 'completed') {
          title = 'Order Completed & Handed Over! 🎉';
          subtitle =
            'Thank you for shopping at Punnagai Toy Store! We hope the little ones love their new toys.';
        } else if (status === 'cancelled') {
          title = 'Order Cancelled';
          subtitle =
            'This order has been cancelled. If you need assistance or refund status, please contact us.';
        }

        card.innerHTML = `
      <div class="confirmation-icon" style="background:${badge.bg}; color:${badge.color}; width:68px; height:68px; border-radius:50%; display:flex; align-items:center; justify-content:center; margin:0 auto 20px;">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"></polyline>
        </svg>
      </div>

      <h1 class="confirmation-title" style="font-family:var(--font-heading); font-size:1.8rem; color:var(--text-primary); margin-bottom:8px;">${title}</h1>
      <p class="confirmation-subtitle" style="color:var(--text-secondary); max-width:600px; margin:0 auto 24px; line-height:1.6;">
        ${subtitle}
      </p>

      <div class="order-id-badge" style="margin-bottom:24px;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        Order #${escHtml(orderId)}
      </div>

      <!-- Store Pickup Location Card -->
      <div style="background:var(--primary-50, #fef2f2); border:1.5px solid var(--primary-border, #fecaca); border-radius:14px; padding:20px; text-align:left; margin-bottom:24px;">
        <div style="font-weight:700; font-size:1rem; color:var(--primary, #dc2626); margin-bottom:6px; display:flex; align-items:center; gap:8px;">
          🏪 In-Store Collection Address:
        </div>
        <div style="font-size:0.92rem; color:var(--text-primary); line-height:1.5;">
          <strong>Punnagai Toy Store &amp; Fancy Collections</strong><br>
          4/7 Luz Bazar Complex, R.K. Mutt Road, Mylapore, Chennai – 600 004<br>
          <span style="color:var(--text-muted); font-size:0.85rem;">(Landmark: Near Luz Corner, Mylapore)</span>
        </div>
        <div style="margin-top:10px; display:flex; gap:12px; flex-wrap:wrap; font-size:0.85rem; color:var(--text-secondary);">
          <div>🕒 <strong>Timings:</strong> 10:00 AM – 9:30 PM (All Days)</div>
          <div>📞 <strong>Store Phone:</strong> +91 75501 32101 / +91 72994 61657</div>
        </div>
        <div style="margin-top:14px;">
          <a href="https://maps.google.com/?q=Punnagai+Toy+Store+Mylapore+Chennai" target="_blank" rel="noopener" class="btn btn-sm btn-outline" style="border-radius:99px; background:#fff; font-size:0.82rem; padding:6px 16px;">
            📍 Open in Google Maps
          </a>
        </div>
      </div>

      <div class="order-items-list" style="margin-bottom:24px;">
        <div class="confirmation-details-title" style="font-weight:700; margin-bottom:12px;">Items Reserved for Pickup</div>
        ${itemsHtml || '<p style="color:var(--text-secondary); font-size:14px;">No items found</p>'}
      </div>

      <div class="confirmation-details">
        <div class="confirmation-details-title" style="font-weight:700; margin-bottom:12px;">Order &amp; Payment Status</div>
        <div class="detail-row">
          <span class="label">Status</span>
          <span class="value">
            <span style="display:inline-block; background:${badge.bg}; color:${badge.color}; border-radius:6px; padding:3px 12px; font-size:13px; font-weight:700;">${escHtml(badge.label)}</span>
          </span>
        </div>
        <div class="detail-row"><span class="label">Subtotal</span><span class="value">${fmt(order.subtotal)}</span></div>
        <div class="detail-row"><span class="label">Fulfillment</span><span class="value" style="color:var(--primary, #dc2626); font-weight:700;">Store Pickup (Free)</span></div>
        ${discountRow}
        <div class="detail-row"><span class="label" style="font-weight:700;">Total Amount</span><span class="value" style="font-size:1.15rem; color:var(--primary, #dc2626); font-weight:800;">${fmt(order.total)}</span></div>
        ${customer.name ? `<div class="detail-row"><span class="label">Customer</span><span class="value">${escHtml(customer.name)}</span></div>` : ''}
        ${customer.phone ? `<div class="detail-row"><span class="label">Phone</span><span class="value">${escHtml(customer.phone)}</span></div>` : ''}
        ${customer.pickupNotes || order.notes ? `<div class="detail-row"><span class="label">Pickup Notes</span><span class="value" style="font-weight:400;">${escHtml(customer.pickupNotes || order.notes)}</span></div>` : ''}
        ${proofSection}
      </div>

      <div class="confirmation-actions" style="margin-top:28px;">
        <a href="${buildTrackWhatsAppUrl(orderId)}" target="_blank" rel="noopener" class="whatsapp-track-btn" style="background:#25d366; color:#fff; border-radius:99px; padding:12px 24px; font-weight:700; text-decoration:none; display:inline-flex; align-items:center; gap:8px;">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 0 1-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 0 1-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 0 1 2.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0 0 12.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 0 0 5.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 0 0-3.48-8.413Z"/></svg>
          Chat with Shop on WhatsApp
        </a>
        <a href="shop.html" class="btn btn-outline btn-lg" style="border-radius:99px; justify-content:center;">
          Continue Shopping
        </a>
      </div>
    `;
      }

      function renderError(message) {
        const card = document.getElementById('confirmation-content');
        if (!card) return;
        card.innerHTML = `
      <div style="text-align:center; padding:20px 0;">
        <div style="font-size:3rem; margin-bottom:16px;">⚠️</div>
        <h2 style="margin-bottom:8px;">Order Not Found</h2>
        <p style="color:var(--text-secondary); margin-bottom:24px;">${escHtml(message)}</p>
        <a href="shop.html" class="btn btn-primary">Back to Shop</a>
      </div>
    `;
      }

      document.addEventListener('DOMContentLoaded', async () => {
        if (typeof renderNavbar === 'function') renderNavbar('');
        if (typeof renderFooter === 'function') renderFooter();

        const params = new URLSearchParams(window.location.search);
        const orderId = params.get('orderId');

        if (!orderId) {
          renderError('No order ID found in the URL. Please check your order confirmation email.');
          return;
        }

        // Try reading session cached order first (useful for guest checkouts in Firebase mode)
        let cachedOrder = null;
        try {
          const raw = sessionStorage.getItem('punnagai_last_order');
          if (raw) {
            const parsed = JSON.parse(raw);
            if (parsed && (parsed.id === orderId || parsed.orderId === orderId)) {
              cachedOrder = parsed;
            }
          }
        } catch (_) {}

        // Attach real-time onSnapshot listener in Firebase mode so status transitions (shipped, delivered) reflect live
        let unsubscribeOrder = null;
        if (!window.USE_LOCAL_MODE && window.db && typeof window.db.collection === 'function') {
          try {
            unsubscribeOrder = window.db
              .collection('orders')
              .doc(orderId)
              .onSnapshot(
                (doc) => {
                  if (doc.exists) {
                    renderConfirmation({ id: doc.id, ...doc.data() });
                  } else if (cachedOrder) {
                    renderConfirmation(cachedOrder);
                  }
                },
                (err) => {
                  console.warn('[order-confirmation] onSnapshot error, falling back:', err);
                  loadOrderFallback();
                }
              );
            window.addEventListener('beforeunload', () => {
              if (typeof unsubscribeOrder === 'function') unsubscribeOrder();
            });
            return;
          } catch (err) {
            console.warn('[order-confirmation] Could not attach listener:', err);
          }
        }

        await loadOrderFallback();

        async function loadOrderFallback() {
          if (typeof getOrderById === 'function') {
            try {
              const order = await getOrderById(orderId);
              if (order) {
                renderConfirmation(order);
                return;
              }
            } catch (err) {
              console.warn('Could not load order from remote data layer:', err);
            }
          }

          if (cachedOrder) {
            renderConfirmation(cachedOrder);
          } else {
            // Minimal fallback
            renderConfirmation({
              id: orderId,
              orderId,
              orderStatus: 'confirmed',
              items: [],
              subtotal: 0,
              shippingFee: 0,
              discount: 0,
              total: 0,
              shippingAddress: {}
            });
          }
        }
      });
    </script>
  </body>
</html>
