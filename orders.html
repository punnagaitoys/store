<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Order History | Punnagai Toy Store</title>
    <link rel="icon" href="favicon.png" type="image/png" />
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css?v=14" />
    <style>
      .order-card {
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 16px;
        margin-bottom: 16px;
        background: white;
      }
      .order-header {
        display: flex;
        justify-content: space-between;
        border-bottom: 1px solid var(--border);
        padding-bottom: 12px;
        margin-bottom: 12px;
      }
      .order-status {
        font-weight: 600;
        color: var(--primary);
      }
      .order-items {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .order-item {
        display: flex;
        justify-content: space-between;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <div id="navbar"></div>
    <div id="toast-container" class="toast-container"></div>

    <main class="page-wrapper container section">
      <div class="section-header">
        <h1 class="section-title">Order History</h1>
        <div class="section-divider"></div>
      </div>

      <div style="margin-bottom: 24px">
        <a href="account.html" class="btn btn-outline">? Back to Profile</a>
      </div>

      <div id="orders-list">
        <div class="loading-spinner-center">
          <div class="loading-spinner"></div>
        </div>
      </div>
    </main>

    <div id="footer"></div>

    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>

    <script src="js/env-config.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/data.js"></script>
    <script src="js/lib/validation.js"></script>
    <script src="js/lib/wishlist.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/app.js?v=14"></script>

    <script>
      function escapeHtml(str) {
        if (typeof window !== 'undefined' && typeof window.escapeHtml === 'function') {
          return window.escapeHtml(str);
        }
        if (str === null || str === undefined) return '';
        return String(str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');
      }

      async function loadOrders() {
        renderNavbar();
        renderFooter();

        const user = window.PunnagaiAuth.getCurrentUser();
        if (!user) {
          window.location.href = 'account.html?redirect=orders.html';
          return;
        }

        try {
          const orders = await getOrdersByUser(user.userId || user.uid);
          const container = document.getElementById('orders-list');

          if (orders.length === 0) {
            container.innerHTML = `
              <div class="empty-state" style="padding: 48px 20px; text-align: center;">
                <div class="empty-state-icon" style="margin-bottom: 16px;">
                  <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#94A3B8" stroke-width="1.5" aria-hidden="true">
                    <rect x="2" y="3" width="20" height="14" rx="2" ry="2"/>
                    <line x1="8" y1="21" x2="16" y2="21"/>
                    <line x1="12" y1="17" x2="12" y2="21"/>
                  </svg>
                </div>
                <h3 class="empty-state-title" style="font-family: var(--font-heading); font-size: 1.4rem; color: var(--text-primary); margin-bottom: 8px;">No Orders Yet</h3>
                <p class="empty-state-desc" style="color: var(--text-secondary); max-width: 440px; margin: 0 auto 24px; line-height: 1.6;">You haven't placed any orders yet. Discover our collection of educational toys, board games, and puzzles.</p>
                <a href="shop.html" class="btn btn-primary" style="display: inline-flex; align-items: center; gap: 8px;">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
                  Browse Toys
                </a>
              </div>
            `;
            return;
          }

          // Sort orders by createdAt descending
          orders.sort((a, b) => {
            const timeA = a.createdAt?.seconds ? a.createdAt.seconds * 1000 : a.createdAt || 0;
            const timeB = b.createdAt?.seconds ? b.createdAt.seconds * 1000 : b.createdAt || 0;
            return timeB - timeA;
          });

          container.innerHTML = orders
            .map((order) => {
              const createdMs = order.createdAt?.seconds
                ? order.createdAt.seconds * 1000
                : order.createdAt || Date.now();
              const date = new Date(createdMs).toLocaleDateString('en-IN', {
                year: 'numeric',
                month: 'short',
                day: 'numeric'
              });
              return `
            <div class="order-card">
              <div class="order-header">
                <div>
                  <div style="font-size:12px; color:var(--text-secondary)">Order #${escapeHtml(order.id)}</div>
                  <div style="font-weight:500">${escapeHtml(date)}</div>
                </div>
                <div class="text-right">
                  <div class="order-status">${escapeHtml((order.orderStatus || order.status || '').toUpperCase())}</div>
                  <div style="font-weight:600">₹${(Number(order.total) || 0).toLocaleString('en-IN')}</div>
                </div>
              </div>
              <div class="order-items">
                ${(Array.isArray(order.items) ? order.items : [])
                  .map(
                    (item) => `
                  <div class="order-item">
                    <span>${Number(item.quantity) || 1}x ${escapeHtml(item.name || 'Item')}</span>
                    <span>₹${((Number(item.price) || 0) * (Number(item.quantity) || 1)).toLocaleString('en-IN')}</span>
                  </div>
                `
                  )
                  .join('')}
              </div>
              <div style="margin-top:10px; padding-top:10px; border-top:1px dashed var(--border); font-size:13px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px;">
                <div style="color:var(--text-secondary); display:flex; gap:12px; flex-wrap:wrap;">
                  <span>🏪 <strong>Pickup:</strong> 4/7 Luz Bazar Complex, Mylapore</span>
                  <span>🛡️ <strong>Payment:</strong> Shop UPI QR</span>
                </div>
                ${
                  order.paymentProofUrl
                    ? `<div>
                        <a href="${escapeHtml(order.paymentProofUrl)}" target="_blank" rel="noopener" class="btn btn-sm btn-outline" style="font-size:12px; padding:3px 10px;">
                          📸 View Payment Proof
                        </a>
                      </div>`
                    : ''
                }
              </div>
            </div>
          `;
            })
            .join('');
        } catch (e) {
          document.getElementById('orders-list').innerHTML = `
            <div class="empty-state" style="padding: 40px 20px; text-align: center;">
              <h3 style="color: var(--danger); margin-bottom: 8px;">Unable to load orders</h3>
              <p style="color: var(--text-secondary); margin-bottom: 16px;">We encountered a problem fetching your order history.</p>
              <button onclick="loadOrders()" class="btn btn-outline" style="cursor: pointer;">Try Again</button>
            </div>
          `;
        }
      }

      document.addEventListener('DOMContentLoaded', () => {
        setTimeout(loadOrders, 500);
      });

      window.addEventListener('storage', (e) => {
        if (e.key === 'punnagai_mock_orders') {
          loadOrders();
        }
      });
    </script>
  </body>
</html>
