services:
  - type: web
    name: punnagai-toy-store
    env: static
    buildCommand: npm run build
    staticPublishPath: .
    customDomains:
      - punnagaitoysfancy.in
      - www.punnagaitoysfancy.in
    routes:
      - type: rewrite
        source: /shop
        destination: /shop.html
      - type: rewrite
        source: /cart
        destination: /cart.html
      - type: rewrite
        source: /checkout
        destination: /checkout.html
      - type: rewrite
        source: /product
        destination: /product.html
      - type: rewrite
        source: /admin
        destination: /admin.html
      - type: rewrite
        source: /wishlist
        destination: /wishlist.html
      - type: rewrite
        source: /orders
        destination: /orders.html
      - type: rewrite
        source: /order-confirmation
        destination: /order-confirmation.html
      - type: rewrite
        source: /account
        destination: /account.html
      - type: rewrite
        source: /terms
        destination: /terms.html
      - type: rewrite
        source: /privacy
        destination: /privacy.html
      - type: rewrite
        source: /returns
        destination: /returns.html
      - type: rewrite
        source: /delivery
        destination: /delivery.html
      - type: rewrite
        source: /payments
        destination: /payments.html
      - type: rewrite
        source: /sale-terms
        destination: /sale-terms.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: "camera=(), microphone=(), geolocation=()"
      - path: /admin*
        name: X-Robots-Tag
        value: "noindex, nofollow"
      - path: /sw.js
        name: Cache-Control
        value: "no-cache, no-store, must-revalidate"
      - path: /robots.txt
        name: Cache-Control
        value: "public, max-age=3600"
      - path: /sitemap.xml
        name: Cache-Control
        value: "public, max-age=3600"
      - path: /llms.txt
        name: Cache-Control
        value: "public, max-age=86400"
      - path: /manifest.webmanifest
        name: Cache-Control
        value: "public, max-age=86400"
      - path: /css/*
        name: Cache-Control
        value: "public, max-age=604800, stale-while-revalidate=86400"
      - path: /js/*
        name: Cache-Control
        value: "public, max-age=604800, stale-while-revalidate=86400"
      - path: /logo.png
        name: Cache-Control
        value: "public, max-age=2592000"
      - path: /images/*
        name: Cache-Control
        value: "public, max-age=2592000"
