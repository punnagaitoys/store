<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Shop all toys at Punnagai Toy Store, Mylapore, Chennai. Filter by age group and category. Educational toys, board games, outdoor toys and more."
    />
    <!-- OpenGraph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Punnagai Toy Store" />
    <meta property="og:title" content="Shop All Toys | Punnagai Toy Store — Mylapore, Chennai" />
    <meta
      property="og:description"
      content="Browse 500+ quality toys at Punnagai Toy Store. Filter by age, category, and price. Educational, outdoor, board games & more."
    />
    <meta property="og:image" content="https://punnagaitoys.com/logo.png" />
    <meta property="og:url" content="https://punnagaitoys.com/shop.html" />
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Shop All Toys | Punnagai Toy Store" />
    <meta
      name="twitter:description"
      content="Browse 500+ quality toys at Punnagai Toy Store, Mylapore."
    />
    <meta name="twitter:image" content="https://punnagaitoys.com/logo.png" />
    <title>Shop All Toys | Punnagai Toy Store — Mylapore, Chennai</title>
    <link rel="icon" href="logo.png" type="image/png" />
    <link rel="apple-touch-icon" href="logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div id="navbar"></div>
    <div id="toast-container" class="toast-container"></div>

    <main class="page-wrapper">
      <div class="container">
        <!-- Breadcrumb -->
        <nav class="breadcrumb" aria-label="Breadcrumb">
          <a href="index.html">Home</a>
          <span class="breadcrumb-sep">›</span>
          <span class="breadcrumb-current">Shop</span>
        </nav>

        <!-- Shop Header -->
        <div class="shop-page-header">
          <h1 class="shop-title">All Toys</h1>
          <div class="search-wrapper">
            <input
              type="text"
              id="search-input"
              class="search-input"
              placeholder="Search toys by name, category..."
              aria-label="Search toys"
              autocomplete="off"
              role="combobox"
              aria-expanded="false"
              aria-controls="search-autocomplete"
            />
            <svg
              class="search-icon"
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              aria-hidden="true"
            >
              <circle cx="11" cy="11" r="8" />
              <path d="m21 21-4.35-4.35" />
            </svg>
            <!-- Autocomplete suggestions (top 5 products) -->
            <ul id="search-autocomplete" class="search-autocomplete" role="listbox" hidden></ul>
          </div>
        </div>

        <div class="shop-layout">
          <!-- Filter Sidebar -->
          <aside class="filter-sidebar" id="filter-sidebar" aria-label="Product filters">
            <div class="filter-header">
              <h3>Filters</h3>
              <button class="clear-filters-btn" onclick="clearAllFilters()" type="button">
                Clear All
              </button>
            </div>

            <!-- Age Group Filter -->
            <div class="filter-group">
              <h4 class="filter-group-title">
                <svg
                  width="16"
                  height="16"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  aria-hidden="true"
                >
                  <circle cx="12" cy="8" r="4" />
                  <path d="M6 20v-2a6 6 0 0 1 12 0v2" />
                </svg>
                Shop by Age
              </h4>
              <div class="filter-options">
                <label class="filter-option" for="filter-age-0-2">
                  <input type="checkbox" id="filter-age-0-2" data-age="0-2" />
                  <span class="filter-checkmark"></span>
                  <span>Baby (0–2 years)</span>
                </label>
                <label class="filter-option" for="filter-age-3-5">
                  <input type="checkbox" id="filter-age-3-5" data-age="3-5" />
                  <span class="filter-checkmark"></span>
                  <span>Toddler (3–5 years)</span>
                </label>
                <label class="filter-option" for="filter-age-6-8">
                  <input type="checkbox" id="filter-age-6-8" data-age="6-8" />
                  <span class="filter-checkmark"></span>
                  <span>Kids (6–8 years)</span>
                </label>
                <label class="filter-option" for="filter-age-9-12">
                  <input type="checkbox" id="filter-age-9-12" data-age="9-12" />
                  <span class="filter-checkmark"></span>
                  <span>Tween (9–12 years)</span>
                </label>
                <label class="filter-option" for="filter-age-12p">
                  <input type="checkbox" id="filter-age-12p" data-age="12+" />
                  <span class="filter-checkmark"></span>
                  <span>Teen (12+ years)</span>
                </label>
              </div>
            </div>

            <!-- Category Filter -->
            <div class="filter-group">
              <h4 class="filter-group-title">
                <svg
                  width="16"
                  height="16"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  aria-hidden="true"
                >
                  <rect x="3" y="3" width="7" height="7" />
                  <rect x="14" y="3" width="7" height="7" />
                  <rect x="14" y="14" width="7" height="7" />
                  <rect x="3" y="14" width="7" height="7" />
                </svg>
                Category
              </h4>
              <div class="filter-options">
                <label class="filter-option">
                  <input type="checkbox" data-cat="Educational & Learning" />
                  <span class="filter-checkmark"></span>
                  <span>Educational &amp; Learning</span>
                </label>
                <label class="filter-option">
                  <input type="checkbox" data-cat="Building Blocks" />
                  <span class="filter-checkmark"></span>
                  <span>Building Blocks</span>
                </label>
                <label class="filter-option">
                  <input type="checkbox" data-cat="Board Games & Puzzles" />
                  <span class="filter-checkmark"></span>
                  <span>Board Games &amp; Puzzles</span>
                </label>
                <label class="filter-option">
                  <input type="checkbox" data-cat="Outdoor & Sports" />
                  <span class="filter-checkmark"></span>
                  <span>Outdoor &amp; Sports</span>
                </label>
                <label class="filter-option">
                  <input type="checkbox" data-cat="Arts & Crafts" />
                  <span class="filter-checkmark"></span>
                  <span>Arts &amp; Crafts</span>
                </label>
                <label class="filter-option">
                  <input type="checkbox" data-cat="Dolls & Fashion" />
                  <span class="filter-checkmark"></span>
                  <span>Dolls &amp; Fashion</span>
                </label>
                <label class="filter-option">
                  <input type="checkbox" data-cat="Remote Control" />
                  <span class="filter-checkmark"></span>
                  <span>Remote Control</span>
                </label>
                <label class="filter-option">
                  <input type="checkbox" data-cat="Musical Toys" />
                  <span class="filter-checkmark"></span>
                  <span>Musical Toys</span>
                </label>
                <label class="filter-option">
                  <input type="checkbox" data-cat="Soft Toys & Plush" />
                  <span class="filter-checkmark"></span>
                  <span>Soft Toys &amp; Plush</span>
                </label>
                <label class="filter-option">
                  <input type="checkbox" data-cat="Action & Adventure" />
                  <span class="filter-checkmark"></span>
                  <span>Action &amp; Adventure</span>
                </label>
              </div>
            </div>

            <!-- Price Range Filter -->
            <div class="filter-group">
              <h4 class="filter-group-title">
                <svg
                  width="16"
                  height="16"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  aria-hidden="true"
                >
                  <line x1="12" y1="1" x2="12" y2="23" />
                  <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6" />
                </svg>
                Price Range
              </h4>
              <div class="filter-options">
                <label class="filter-option">
                  <input
                    type="radio"
                    name="price-range"
                    data-price-min=""
                    data-price-max=""
                    checked
                  />
                  <span class="filter-checkmark"></span>
                  <span>All Prices</span>
                </label>
                <label class="filter-option">
                  <input type="radio" name="price-range" data-price-min="0" data-price-max="500" />
                  <span class="filter-checkmark"></span>
                  <span>Under ₹500</span>
                </label>
                <label class="filter-option">
                  <input
                    type="radio"
                    name="price-range"
                    data-price-min="500"
                    data-price-max="1000"
                  />
                  <span class="filter-checkmark"></span>
                  <span>₹500 – ₹1,000</span>
                </label>
                <label class="filter-option">
                  <input
                    type="radio"
                    name="price-range"
                    data-price-min="1000"
                    data-price-max="1500"
                  />
                  <span class="filter-checkmark"></span>
                  <span>₹1,000 – ₹1,500</span>
                </label>
                <label class="filter-option">
                  <input type="radio" name="price-range" data-price-min="1500" data-price-max="" />
                  <span class="filter-checkmark"></span>
                  <span>Over ₹1,500</span>
                </label>
              </div>
            </div>

            <!-- Sale Filter -->
            <div class="filter-group">
              <h4 class="filter-group-title">
                <svg
                  width="16"
                  height="16"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  aria-hidden="true"
                >
                  <path
                    d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"
                  />
                </svg>
                Offers
              </h4>
              <div class="filter-options">
                <label class="filter-option">
                  <input type="checkbox" data-sale="true" />
                  <span class="filter-checkmark"></span>
                  <span>On Sale</span>
                </label>
                <label class="filter-option">
                  <input type="checkbox" data-featured="true" />
                  <span class="filter-checkmark"></span>
                  <span>Featured</span>
                </label>
              </div>
            </div>

            <!-- Mobile Close Button -->
            <button
              class="close-filters-btn"
              id="close-filters"
              onclick="toggleFilterSidebar()"
              type="button"
            >
              <svg
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <line x1="18" y1="6" x2="6" y2="18" />
                <line x1="6" y1="6" x2="18" y2="18" />
              </svg>
              Close Filters
            </button>
          </aside>

          <!-- Main Product Area -->
          <div class="shop-main">
            <!-- Active Filters Tags -->
            <div id="active-filters" class="active-filters" style="display: none"></div>

            <!-- Toolbar -->
            <div class="shop-toolbar">
              <div class="shop-results-info">
                <span id="product-count" role="status" aria-live="polite">Loading...</span>
              </div>
              <div class="shop-toolbar-right">
                <button
                  class="filter-toggle-btn"
                  onclick="toggleFilterSidebar()"
                  type="button"
                  aria-label="Toggle filters"
                >
                  <svg
                    width="18"
                    height="18"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    aria-hidden="true"
                  >
                    <line x1="4" y1="6" x2="20" y2="6" />
                    <line x1="8" y1="12" x2="20" y2="12" />
                    <line x1="12" y1="18" x2="20" y2="18" />
                  </svg>
                  Filters
                  <span id="filter-count-badge" class="filter-count-badge" style="display: none"
                    >0</span
                  >
                </button>
                <select id="sort-select" class="sort-select" aria-label="Sort products">
                  <option value="popularity">Popularity</option>
                  <option value="price-asc">Price: Low to High</option>
                  <option value="price-desc">Price: High to Low</option>
                  <option value="newest">Newest Arrivals</option>
                  <option value="rating">Rating</option>
                </select>
              </div>
            </div>

            <!-- Product Grid -->
            <div id="shop-product-grid" class="product-grid">
              <!-- Loading skeletons -->
              <div class="skeleton-card"></div>
              <div class="skeleton-card"></div>
              <div class="skeleton-card"></div>
              <div class="skeleton-card"></div>
              <div class="skeleton-card"></div>
              <div class="skeleton-card"></div>
              <div class="skeleton-card"></div>
              <div class="skeleton-card"></div>
            </div>

            <!-- Empty State -->
            <div id="shop-empty-state" class="empty-state" style="display: none">
              <div class="empty-state-icon">
                <svg
                  width="64"
                  height="64"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="#D1D5DB"
                  stroke-width="1.5"
                >
                  <circle cx="11" cy="11" r="8" />
                  <path d="m21 21-4.35-4.35" />
                </svg>
              </div>
              <h3 class="empty-state-title">No toys found</h3>
              <p class="empty-state-desc">
                Try adjusting your filters or search term to find what you're looking for.
              </p>
              <button class="btn btn-primary" onclick="clearAllFilters()" type="button">
                Clear All Filters
              </button>
            </div>

            <!-- Pagination -->
            <nav
              id="shop-pagination"
              class="shop-pagination"
              aria-label="Product pages"
              style="display: none"
            ></nav>
          </div>
        </div>
      </div>
    </main>

    <!-- Mobile Filter Overlay -->
    <div
      class="filter-overlay"
      id="filter-overlay"
      onclick="toggleFilterSidebar()"
      aria-hidden="true"
    ></div>

    <!-- WhatsApp Float Button -->
    <a
      href="https://wa.me/916381801640?text=Hi! I'd like to enquire about a toy."
      target="_blank"
      class="whatsapp-float"
      aria-label="Chat on WhatsApp"
    >
      <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor">
        <path
          d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 0 1-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 0 1-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 0 1 2.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0 0 12.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 0 0 5.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 0 0-3.48-8.413Z"
        />
      </svg>
    </a>

    <div id="footer"></div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <!-- App Scripts -->
    <script src="js/firebase-config.js"></script>
    <script src="js/data.js"></script>
    <script src="js/lib/inventory-model.js"></script>
    <script src="js/lib/catalog.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/app.js"></script>
    <script>
      function toggleFilterSidebar() {
        const sidebar = document.getElementById('filter-sidebar');
        const overlay = document.getElementById('filter-overlay');
        sidebar.classList.toggle('open');
        overlay.classList.toggle('show');
        document.body.classList.toggle('filter-open');
      }
    </script>
  </body>
</html>
